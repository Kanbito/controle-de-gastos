name: Gerar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ControleDeGastos/ControleDeGastos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ControleDeGastos-apk
          path: |
            ControleDeGastos/ControleDeGastos/app/build/outputs/apk/debug/*.apk
            ControleDeGastos/ControleDeGastos/app/build/outputs/apk/release/*.apk
